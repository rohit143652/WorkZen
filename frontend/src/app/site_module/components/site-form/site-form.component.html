<div class="page-header"><h1>{{ isEditMode() ? 'Edit Site' : 'Add Site' }}</h1></div>

<form [formGroup]="form" (ngSubmit)="submit()" class="card form-card" novalidate>
  <div class="section-title">Site Details</div>
  <div class="form-grid">
    <div class="form-field">
      <label>Site Code <span class="muted" style="font-weight:400;">(auto-generated)</span></label>
      <input type="text" formControlName="siteCode" placeholder="e.g. SITE0001" />
    </div>
    <div class="form-field"><label>Site Name</label><input type="text" formControlName="siteName" /></div>
    <div class="form-field" style="grid-column: 1 / -1;"><label>Description</label><input type="text" formControlName="description" /></div>
    <div class="form-field"><label>Site Contact Person</label><input type="text" formControlName="siteContactPerson" /></div>
    <div class="form-field"><label>Site Contact Number</label><input type="text" formControlName="siteContactNumber" /></div>
  </div>

  <div class="section-title">Address</div>
  <div class="form-grid">
    <div class="form-field" style="grid-column: 1 / -1;"><label>Address</label><input type="text" formControlName="address" /></div>
    <div class="form-field"><label>City</label><input type="text" formControlName="city" /></div>
    <div class="form-field"><label>State</label><input type="text" formControlName="state" /></div>
    <div class="form-field"><label>Country</label><input type="text" formControlName="country" /></div>
    <div class="form-field"><label>Pincode</label><input type="text" formControlName="pincode" /></div>
  </div>

  <div class="section-title">Manpower Requirement</div>
  <div class="form-grid">
    <div class="form-field"><label>Required Employee Count</label><input type="number" min="0" formControlName="requiredEmployeeCount" /></div>
    <div class="form-field">
      <label style="display:flex; align-items:center; gap:0.5rem;">
        <input type="checkbox" formControlName="allowOverAllocation" style="width:auto;" />
        Allow over-allocation beyond the required count
      </label>
    </div>
  </div>

  <div class="form-actions">
    <a routerLink="/sites" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">{{ saving() ? 'Saving...' : 'Save Site' }}</button>
  </div>
</form>
